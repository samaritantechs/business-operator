plugins { id 'com.android.application' }

android {
    namespace 'com.samaritantechs.industrial'
    compileSdk 34

    /* WORKED OUT BEFORE THE BLOCK, NOT INSIDE IT.
     *
     * These were written as `versionCode (findProperty(...) ?: 1) as Integer`, which reads
     * correctly and parses wrongly: Groovy takes it as `versionCode(...)` called first and the
     * RESULT cast, so the setter received nothing and AGP failed the build with "Value is
     * null" -- pointing at the line, and saying nothing about why. A local variable has no
     * ambiguity to get wrong.
     *
     * CI PASSES THESE IN, so whatever it compiles is exactly what it registers and the two
     * numbers cannot drift. A build with no override -- yours, on a laptop -- uses the
     * defaults here. */
    def buildVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().trim().toInteger()
    def buildVersionName = (project.findProperty('appVersionName') ?: '1.0').toString().trim()

    defaultConfig {
        applicationId "com.samaritantechs.industrial"
        minSdk 24
        targetSdk 34

        /* THE TWO NUMBERS THAT MATTER.
         *
         * versionCode must go UP by at least one on every build you hand out. Android refuses
         * to install an APK over one with an equal or higher code, and the refusal looks to a
         * shopkeeper like the download is broken. The Settings screen enforces the same rule
         * on the web side, so the two agree.
         *
         * versionName is what a person reads. */
        /* NOTHING HAS EVER BEEN PUBLISHED, SO THIS STARTS AT ONE. The 4 / "1.3" that used to sit
         * here were template examples, and they were not harmless: the site shows its "a newer
         * app is available" bar whenever the PUBLISHED code is higher than the code compiled
         * into the running app, so a first APK claiming 4 and a release row saying 1 disagree
         * from the very first install.
         *
         * WHATEVER IS HERE IS WHAT YOU TYPE INTO Settings -> Android app. The two numbers are
         * one number in two places. */
        versionCode buildVersionCode
        versionName buildVersionName
    }

    /* THE KEYSTORE NEVER ENTERS THIS REPOSITORY, and neither do its passwords. Both of the
     * ways in below are git-ignored; there is no third way, and no default that quietly signs
     * with something else.
     *
     * A FILE, NOT FOUR ENVIRONMENT VARIABLES, IS THE DEFAULT. Environment variables are the
     * right shape for a build server and the wrong one for a person at a laptop: they are set
     * in one terminal window and gone from the next, Windows `set` eats a % in a password
     * without saying so, and a relative path in SAMIND_KEYSTORE resolves against app/ rather
     * than android/. Every one of those failures surfaces at the very END of a long build, as
     * a message naming a missing file rather than a missing variable. keystore.properties has
     * none of those edges: it is one file, in one known place, that either exists or does not.
     * The environment variables still work, for CI, and win if both are present. */
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    /* Anchored on rootProject (android/), never on the app module, so a path written by a
     * person means what they think it means. An absolute path is used as given. */
    def storePath = System.getenv("SAMIND_KEYSTORE") ?: keystoreProps.getProperty('storeFile')
    def resolvedStore = storePath ? rootProject.file(storePath) : null

    signingConfigs {
        release {
            /* A keystore that is not there must fail LOUDLY and early. Pointing this at a
             * placeholder name would let the build get all the way to packaging before
             * complaining about a file nobody ever meant to exist. */
            if (resolvedStore != null) {
                storeFile resolvedStore
                storePassword System.getenv("SAMIND_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv("SAMIND_KEY_ALIAS") ?: keystoreProps.getProperty('keyAlias') ?: 'businessoperator'
                keyPassword System.getenv("SAMIND_KEY_PASSWORD") ?: keystoreProps.getProperty('keyPassword') ?: System.getenv("SAMIND_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty('storePassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            /* NO KEYSTORE MEANS NO SIGNING CONFIG -- and therefore app-release-unsigned.apk
             * and a build that says so, rather than a release APK signed with the DEBUG key.
             * A debug-signed APK handed to a shop is the one mistake with no way back: every
             * future properly-signed update refuses to install over it. */
            if (resolvedStore != null) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("SIGNING: no keystore configured (android/keystore.properties absent and SAMIND_KEYSTORE unset).\n"
                    + "         assembleRelease will produce an UNSIGNED apk, which no phone will install.\n"
                    + "         See android/README.md -- 'Making your signing key'.")
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* ONE KOTLIN, NOT TWO. Kotlin 1.8 folded kotlin-stdlib-jdk7 and -jdk8 INTO kotlin-stdlib.
     * The AndroidX libraries below pull kotlin-stdlib 1.8.22 and, transitively, the old split
     * artifact at 1.6.21 -- and nothing asks for a newer one, so Gradle keeps it. Both jars
     * then carry the same classes and dexing stops:
     *
     *     Duplicate class kotlin.time.jdk8.DurationConversionsJDK8Kt found in modules
     *     kotlin-stdlib-1.8.22.jar and kotlin-stdlib-jdk8-1.6.21.jar
     *
     * The BOM pins every kotlin-* artifact to one version. At 1.8.22 the jdk7/jdk8 modules are
     * empty shims that simply depend on kotlin-stdlib, so the duplicate disappears rather than
     * being excluded -- nothing is dropped that something might have needed. 1.8.22 is the
     * version already winning in the graph, so this moves nothing else.
     * This app contains no Kotlin of its own; the stdlib is here only because AndroidX is. */
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
}
