# Required: the app depends on androidx.appcompat and androidx.activity. Without this AGP
# refuses the build outright -- "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled".
android.useAndroidX=true

# The default on AGP 8, stated so the build cannot change meaning if a future AGP flips it.
android.nonTransitiveRClass=true

# The default daemon heap is too small for an AGP 8 release build; without this it can die
# with "Expiring Daemon because JVM heap space is exhausted", which reads as a hang.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
